name: warmhouse

x-dotnet-build: &dotnet-build
  context: .
  dockerfile: deploy/Dockerfile

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [warmhouse]

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: warmhouse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warmhouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    <<: *service-defaults

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: warmhouse-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    <<: *service-defaults

  # ---------------------------------------------------------------------------
  # Simulated partner device (assignment 5)
  # ---------------------------------------------------------------------------

  temperature-api:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Simulators/WarmHouse.TemperatureApi/WarmHouse.TemperatureApi.csproj
        ASSEMBLY_NAME: WarmHouse.TemperatureApi
        APP_PORT: 8081
    container_name: warmhouse-temperature-api
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    <<: *service-defaults

  # ---------------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------------

  identity:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/WarmHouse.Identity/WarmHouse.Identity.csproj
        ASSEMBLY_NAME: WarmHouse.Identity
        APP_PORT: 8080
    container_name: warmhouse-identity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/warmhouse_identity
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8010:8080"
    <<: *service-defaults

  devices:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/WarmHouse.Devices/WarmHouse.Devices.csproj
        ASSEMBLY_NAME: WarmHouse.Devices
        APP_PORT: 8080
    container_name: warmhouse-devices
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/warmhouse_devices
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8020:8080"
    <<: *service-defaults

  heating:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/WarmHouse.Heating/WarmHouse.Heating.csproj
        ASSEMBLY_NAME: WarmHouse.Heating
        APP_PORT: 8080
    container_name: warmhouse-heating
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/warmhouse_heating
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8030:8080"
    <<: *service-defaults

  lighting:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/WarmHouse.Lighting/WarmHouse.Lighting.csproj
        ASSEMBLY_NAME: WarmHouse.Lighting
        APP_PORT: 8080
    container_name: warmhouse-lighting
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/warmhouse_lighting
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8040:8080"
    <<: *service-defaults

  gates:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/WarmHouse.Gates/WarmHouse.Gates.csproj
        ASSEMBLY_NAME: WarmHouse.Gates
        APP_PORT: 8080
    container_name: warmhouse-gates
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/warmhouse_gates
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8050:8080"
    <<: *service-defaults

  monitoring:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/WarmHouse.Monitoring/WarmHouse.Monitoring.csproj
        ASSEMBLY_NAME: WarmHouse.Monitoring
        APP_PORT: 8080
    container_name: warmhouse-monitoring
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/warmhouse_monitoring
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8060:8080"
    <<: *service-defaults

  telemetry:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/WarmHouse.Telemetry/WarmHouse.Telemetry.csproj
        ASSEMBLY_NAME: WarmHouse.Telemetry
        APP_PORT: 8080
    container_name: warmhouse-telemetry
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/warmhouse_telemetry
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8070:8080"
    <<: *service-defaults

  scenarios:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/WarmHouse.Scenarios/WarmHouse.Scenarios.csproj
        ASSEMBLY_NAME: WarmHouse.Scenarios
        APP_PORT: 8080
    container_name: warmhouse-scenarios
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/warmhouse_scenarios
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8075:8080"
    <<: *service-defaults

  notifications:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/WarmHouse.Notifications/WarmHouse.Notifications.csproj
        ASSEMBLY_NAME: WarmHouse.Notifications
        APP_PORT: 8080
    container_name: warmhouse-notifications
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/warmhouse_notifications
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8085:8080"
    <<: *service-defaults

  # ---------------------------------------------------------------------------
  # Single entry point
  # ---------------------------------------------------------------------------

  gateway:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Gateway/WarmHouse.Gateway/WarmHouse.Gateway.csproj
        ASSEMBLY_NAME: WarmHouse.Gateway
        APP_PORT: 8080
    container_name: warmhouse-gateway
    depends_on:
      - identity
      - devices
      - heating
      - lighting
      - gates
      - monitoring
      - telemetry
      - scenarios
      - notifications
    ports:
      - "8000:8080"
    <<: *service-defaults

volumes:
  postgres_data:

networks:
  warmhouse:
    driver: bridge
